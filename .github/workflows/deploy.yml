name: Deploy Portal Pólis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
  schedule:
    # Rede de segurança: garante que o site nunca fique desatualizado por
    # mais de 30 min mesmo se o disparo via Edge Function falhar.
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
  GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
  GA_SERVICE_ACCOUNT_KEY: ${{ secrets.GA_SERVICE_ACCOUNT_KEY }}
  PIPER_VERSION: "2023.11.14-2"
  PIPER_VOICE: "pt_BR-faber-medium"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Sync content from Supabase
        run: npm run sync-content

      - name: Cache Piper binary + modelo de voz
        id: cache-piper
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-${{ env.PIPER_VERSION }}-${{ env.PIPER_VOICE }}

      - name: Baixar Piper + modelo de voz
        if: steps.cache-piper.outputs.cache-hit != 'true'
        run: |
          mkdir -p piper
          curl -sL -o piper.tar.gz "https://github.com/rhasspy/piper/releases/download/${PIPER_VERSION}/piper_linux_x86_64.tar.gz"
          tar -xzf piper.tar.gz -C piper --strip-components=1
          rm piper.tar.gz
          curl -sL -o "piper/${PIPER_VOICE}.onnx" "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/${PIPER_VOICE}.onnx"
          curl -sL -o "piper/${PIPER_VOICE}.onnx.json" "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/${PIPER_VOICE}.onnx.json"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Mesmo racional do "Cache de áudio já gerado" abaixo: evita reprocessar
      # (baixar + rodar ffmpeg) todo GIF já convertido a cada rodada,
      # inclusive no cron de 30 em 30 min — o runner é efêmero, então o
      # manifesto e os MP4/poster já gerados precisam de cache explícito para
      # sobreviver entre execuções.
      - name: Cache de vídeo já gerado (GIF → MP4)
        uses: actions/cache@v4
        with:
          path: |
            public/assets/video
            src/content/video-manifest.json
          key: video-cache-${{ github.run_id }}
          restore-keys: |
            video-cache-

      # Roda logo após o sync-content (precisa de articles.json/banners.json
      # já sincronizados) e antes do build. Processa no máximo
      # TRANSCODE_MAX_NEW GIFs novos por rodada, TRANSCODE_CONCURRENCY em
      # paralelo — protege o job de um backlog grande na primeira rodada
      # (ver scripts/transcode-gif-media.mjs).
      - name: Transcodificar GIFs para vídeo
        run: npm run transcode-media
        env:
          TRANSCODE_MAX_NEW: "20"
          TRANSCODE_CONCURRENCY: "3"

      # Evita reprocessar todas as matérias a cada rodada (inclusive no cron de
      # 30 em 30 min): o script já pula matérias sem mudança via hash, mas só
      # consegue comparar se o MP3 e o manifesto da rodada anterior
      # sobreviverem entre execuções — o runner do Actions é efêmero, então
      # isso precisa de um cache explícito. A chave inclui run_id (sempre um
      # cache novo é salvo ao final) e restore-keys sem sufixo (sempre
      # restaura o mais recente disponível).
      - name: Cache de áudio já gerado
        uses: actions/cache@v4
        with:
          path: |
            public/assets/audio
            src/content/audio-manifest.json
          key: audio-cache-${{ github.run_id }}
          restore-keys: |
            audio-cache-

      - name: Gerar áudio das matérias (Piper TTS)
        run: npm run generate-audio
        env:
          PIPER_BIN: ${{ github.workspace }}/piper/piper
          PIPER_MODEL: ${{ github.workspace }}/piper/${{ env.PIPER_VOICE }}.onnx

      - name: Sync Google Analytics snapshot
        run: npm run sync-analytics

      - name: Build (static export)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Upload static export for E2E
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: ./out
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: static-export
          path: ./out

      - name: E2E smoke tests
        run: npm run test:e2e

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
